name: CI

on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main, desarrollo]

permissions:
  contents: read

# Acciones fijadas por commit (el comentario dice la versión): una etiqueta movida no cambia lo que corre.
# Dependabot (.github/dependabot.yml) propone las actualizaciones.

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tiendas
          POSTGRES_PASSWORD: postgres_dev
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: sqlc-dev/setup-sqlc@c0209b9199cd1cce6a14fc27cabcec491b651761 # v4.0.0
        with:
          sqlc-version: "1.31.1"

      - name: Código generado sin diferencias
        run: |
          go tool templ generate
          sqlc generate
          git diff --exit-code

      - name: Roles y migraciones en Postgres real
        env:
          PGPASSWORD: postgres_dev
        run: |
          psql -h localhost -U postgres -d tiendas -v ON_ERROR_STOP=1 -f docker/postgres/init.sql
          go tool goose -dir migrations postgres "postgres://tiendas_migrator:migrator_dev@localhost:5432/tiendas?sslmode=disable" up
          # La app no debe poder crear tablas.
          ! PGPASSWORD=app_dev psql -h localhost -U tiendas_app -d tiendas -c "CREATE TABLE x(id int)"

      - name: Tests (incluye aislamiento entre tiendas contra Postgres real)
        env:
          TEST_DATABASE_URL: postgres://tiendas_app:app_dev@localhost:5432/tiendas?sslmode=disable
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Interfaz (tipos, compilación y presupuesto de peso de la tienda, 200 KB; npm audit)
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm run budget
          # Dependencias que llegan al navegador (React, Astryx, lucide): sin vulnerabilidades altas conocidas.
          npm audit --omit=dev --audit-level=high

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -exclude-generated ./...

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
