root = "."
tmp_dir = "tmp"

[build]
  cmd = "go tool templ generate; tailwindcss -i web/static/css/input.css -o web/static/css/app.css; go build -o ./tmp/server.exe ./cmd/server"
  entrypoint = ["./tmp/server.exe"]
  include_ext = ["go", "templ", "sql", "css"]
  exclude_dir = ["tmp", "bin", "node_modules"]
  exclude_regex = ["_templ\\.go$", "_test\\.go$", "app\\.css$"]
  delay = 300
