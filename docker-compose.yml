services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tiendas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tiendas"]
      interval: 2s
      retries: 15

  # Servidor de desarrollo con recarga en caliente. En Docker para que corra en Linux como en producción
  # (y porque Windows Defender bloquea los binarios de Go recién compilados).
  app:
    image: golang:1.27
    working_dir: /src
    command:
      - sh
      - -c
      - |
        go tool goose -dir migrations postgres "$$MIGRATIONS_URL" up
        exec go tool air
    env_file:
      - path: .env
        required: false
    environment: # pisa lo que venga de .env: dentro de Docker la base se llama "db"
      APP_ENV: dev
      ADDR: ":8080"
      BASE_DOMAIN: localhost
      DATABASE_URL: postgres://tiendas_app:app_dev@db:5432/tiendas?sslmode=disable
      MIGRATIONS_URL: postgres://tiendas_migrator:migrator_dev@db:5432/tiendas?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_completed_successfully

  # Interfaz: compila frontend/ a web/static/app/ una vez al levantar. Para editar en caliente corre
  # `cd frontend && npm run watch` en Windows: el sondeo desde Docker no ve los cambios del disco de Windows.
  # node_modules vive en un volumen porque rolldown trae binarios nativos y los de Windows no corren en Linux.
  web:
    image: node:24-alpine
    working_dir: /src/frontend
    command: sh -c "npm ci && npm run build"
    volumes:
      - .:/src
      - webmodules:/src/frontend/node_modules

volumes:
  webmodules:
  pgdata:
  gomod:
  gobuild:
